[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "download-music-pipeline"
version = "1.0.0"
description = "One-command local music download, sorting, and Apple Music import pipeline"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10",
  "mutagen>=1.47",
  "pylast>=5",
]

[project.scripts]
download = "download:main"

[tool.setuptools]
py-modules = [
  "download",
  "library_rebuild",
  "library_safety",
  "music_adapter",
  "music_paths",
  "music_taxonomy",
  "pipeline_doctor",
  "pipeline_intake",
  "pipeline_simple",
  "pipeline_state",
  "pipeline_workflow",
  "provider_cache",
  "provider_clients",
]

[tool.ruff]
line-length = 100
target-version = "py311"
