[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "download-music-pipeline"
version = "0.1.0"
description = "Review-first, checksum-verified local music pipeline"
requires-python = ">=3.11"

[project.scripts]
download = "download:main"

[tool.ruff]
line-length = 100
target-version = "py311"
